[package]
edition = "2021"
name = "wardens_phase2"
version = "0.2.0"

[dependencies]
odra = { version = "2.8.2", features = [], default-features = false }
odra-casper-livenet-env = { version = "2.8.2", optional = true }

[features]
livenet = ["odra-casper-livenet-env"]

[dev-dependencies]
odra-test = { version = "2.8.2", features = [], default-features = false }

[build-dependencies]
odra-build = { version = "2.8.2", features = [], default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
odra-build = { version = "2.8.2", features = [], default-features = false }

[[bin]]
name = "wardens_phase2_build_contract"
path = "bin/build_contract.rs"
test = false

[[bin]]
name = "wardens_phase2_livenet"
path = "bin/livenet.rs"
required-features = ["livenet"]
test = false

[profile.release]
codegen-units = 1
lto = true

[profile.dev.package."*"]
opt-level = 3
