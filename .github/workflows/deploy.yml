name: Deploy Wardens Protocol to Azure

on:
  push:
    branches: [ "main", "master" ] # Triggers automatically on push

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 3. Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 4. Build Full On-Chain Rust Contract (GitHub Servers)
        working-directory: contracts/wardens_core
        run: cargo build --release --features livenet --bin wardens_livenet

      - name: 5. Build Next.js Dashboard
        working-directory: dashboard
        run: |
          bun install
          bun run build

      - name: 6. Configure Azure SSH Access
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AZURE_SSH_KEY }}

      - name: 7. Add Azure to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.AZURE_IP }} >> ~/.ssh/known_hosts

      - name: 8. Sync Files to Azure VM
        run: |
          # Copies everything EXCEPT raw rust target debug files and git files
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'contracts/wardens_core/target/debug' \
            ./ ${{ secrets.AZURE_USER }}@${{ secrets.AZURE_IP }}:~/wardens/

      - name: 9. Install Dependencies & Restart Backend on Azure
        run: |
          ssh ${{ secrets.AZURE_USER }}@${{ secrets.AZURE_IP }} << 'EOF'
            export PATH="$HOME/.bun/bin:$PATH"
            cd ~/wardens
            
            # Install Node modules for the backend and agents
            cd backend && bun install && cd ..
            cd agents/parser-agent && bun install && cd ../..
            cd agents/fraud-agent && bun install && cd ../..
            cd agents/registry-agent && bun install && cd ../..
            cd agents/aggregator-agent && bun install && cd ../..
            cd agents/challenger-agent && bun install && cd ../..
            
            # Generate PM2 Configuration (Full On-Chain Mode)
            cat << 'PM2EOF' > ecosystem.config.js
            module.exports = {
              apps: [
                { name: 'backend', script: 'bun', args: 'run dev', cwd: './backend', env: { WARDENS_MODE: 'chain' } },
                { name: 'parser', script: 'bun', args: 'src/index.ts', cwd: './agents/parser-agent' },
                { name: 'fraud', script: 'bun', args: 'src/index.ts', cwd: './agents/fraud-agent' },
                { name: 'registry', script: 'bun', args: 'src/index.ts', cwd: './agents/registry-agent' },
                { name: 'aggregator', script: 'bun', args: 'src/index.ts', cwd: './agents/aggregator-agent' },
                { name: 'challenger', script: 'bun', args: 'src/index.ts', cwd: './agents/challenger-agent' },
                { name: 'dashboard', script: 'bun', args: 'run start', cwd: './dashboard', env: { PORT: '3000' } }
              ]
            };
            PM2EOF
            
            # Start or Restart all applications
            pm2 start ecosystem.config.js || pm2 restart ecosystem.config.js
            pm2 save
          EOF
